<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:"
    />
    <title>Bandloop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span id="logo" class="logo"></span>
        <span class="wordmark">bandloop</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <button id="btn-file" class="btn btn-ghost btn-file" aria-haspopup="menu" aria-expanded="false">Fichier</button>
        <input
          id="project-name"
          class="project-name"
          value="Projet sans titre"
          aria-label="Nom du projet"
          spellcheck="false"
        />
      </div>

      <div class="transport" role="group" aria-label="Transport">
        <button
          id="btn-start"
          class="t-btn"
          data-icon="toStart"
          title="Retour au début (Début)"
          aria-label="Retour au début"
        ></button>
        <button id="btn-stop" class="t-btn" data-icon="stop" title="Stop (Entrée)" aria-label="Stop"></button>
        <button
          id="btn-play"
          class="t-btn t-play"
          data-icon="play"
          title="Lecture / pause (Espace)"
          aria-label="Lecture"
        ></button>
        <div class="rec-group">
          <button id="btn-record" class="t-btn t-record" title="Enregistrer (R)" aria-label="Enregistrer">
            <span class="rec-dot"></span>
          </button>
          <button
            id="btn-record-settings"
            class="t-btn t-rec-settings"
            data-icon="chevronDown"
            title="Réglages d'enregistrement : micro, niveau, latence"
            aria-label="Réglages d'enregistrement"
            aria-expanded="false"
          ></button>
        </div>
        <div class="clock">
          <output id="time-display" class="clock-time">0:00.000</output>
          <span id="time-total" class="clock-total">/ 0:00.000</span>
        </div>
        <label class="tempo" title="Tempo du morceau (enregistré avec le projet)">
          <input id="tempo" type="number" min="20" max="300" step="1" value="120" aria-label="Tempo en BPM" />
          <span>BPM</span>
        </label>
        <div id="meter" class="meter" title="Niveau de sortie"></div>
      </div>

      <div class="topbar-right">
        <div class="edit-tools" role="group" aria-label="Montage">
          <button
            id="btn-undo"
            class="icon-btn"
            data-icon="undo"
            title="Annuler (Ctrl/Cmd+Z)"
            aria-label="Annuler la dernière opération de montage"
            disabled
          ></button>
          <button
            id="btn-redo"
            class="icon-btn"
            data-icon="redo"
            title="Rétablir (Ctrl/Cmd+Maj+Z)"
            aria-label="Rétablir l’opération de montage annulée"
            disabled
          ></button>
          <button
            id="btn-split"
            class="icon-btn"
            data-icon="scissors"
            title="Découper à la tête de lecture ou autour de la sélection (S ou Ctrl/Cmd+K)"
            aria-label="Découper"
          ></button>
          <button
            id="btn-delete"
            class="icon-btn"
            data-icon="trash"
            title="Supprimer la portion ou le clip sélectionné (Suppr ; Maj+Suppr laisse un blanc)"
            aria-label="Supprimer la sélection"
            disabled
          ></button>
        </div>
        <div class="zoom" role="group" aria-label="Zoom">
          <button id="zoom-out" class="icon-btn" data-icon="minus" title="Dézoomer" aria-label="Dézoomer"></button>
          <input id="zoom" type="range" min="10" max="400" value="50" aria-label="Zoom" />
          <button id="zoom-in" class="icon-btn" data-icon="plus" title="Zoomer" aria-label="Zoomer"></button>
        </div>
        <button
          id="btn-import"
          class="btn btn-icon"
          data-icon="import"
          title="Importer des fichiers audio"
          aria-label="Importer des fichiers audio"
        ></button>
        <button
          id="btn-fx-toggle"
          class="btn btn-icon btn-ghost"
          data-icon="sliders"
          aria-pressed="false"
          title="Panneau d'effets vocaux"
          aria-label="Panneau d'effets vocaux"
        ></button>
        <button
          id="btn-export"
          class="btn btn-primary"
          data-icon="export"
          title="Exporter le mix en WAV ou MP3 (Ctrl/Cmd+E)"
          aria-label="Exporter le mix"
        >
          <span class="btn-export-label">Exporter</span>
        </button>
        <input id="file-input" type="file" accept="audio/*" multiple hidden />
      </div>
    </header>

    <div id="busy" class="busy" role="status" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span><span id="busy-text"></span>
    </div>

    <div id="record-panel" class="record-panel" role="dialog" aria-label="Enregistrement" hidden></div>

    <div class="body">
      <div id="countdown" class="countdown" aria-live="assertive" hidden>
        <span id="countdown-value" class="countdown-value"></span>
        <span class="countdown-hint">Échap pour annuler</span>
      </div>
      <main id="workspace" class="workspace">
        <aside id="track-panel" class="track-panel" aria-label="Pistes"></aside>
        <section id="timeline" class="timeline" aria-label="Timeline">
          <canvas id="timeline-canvas"></canvas>
          <div class="timeline-spacer"></div>
        </section>
        <div id="empty-state" class="empty-state">
          <div class="empty-card">
            <span id="empty-logo" class="empty-logo"></span>
            <h1>Commence ton morceau</h1>
            <p>Glisse des fichiers audio dans la fenêtre ou importe-les.</p>
            <div class="empty-actions">
              <button id="btn-import-empty" class="btn btn-primary" data-icon="import">Importer des pistes</button>
              <button id="btn-record-empty" class="btn"><span class="rec-dot small"></span>Enregistrer au micro</button>
            </div>
            <p class="hint">WAV · MP3 · OGG · FLAC · M4A — <kbd>Espace</kbd> lecture, <kbd>R</kbd> enregistrer</p>
          </div>
        </div>
      </main>
      <aside id="fx-panel" class="fx-panel" aria-label="Effets vocaux" hidden></aside>
    </div>

    <footer class="statusbar">
      <span id="status" role="status" aria-live="polite"></span>
      <span id="status-info" class="status-info"></span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
